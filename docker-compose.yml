services:
  postgres:
    image: postgres:16-alpine
    container_name: eventhub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - eventhub-net

  event-service:
    build:
      context: ./services/event-service
    environment:
      SECRET_KEY: event-service-secret
      DEBUG: "0"
      DB_NAME: ${EVENT_DB_NAME}
      DB_USER: ${EVENT_DB_USER}
      DB_PASSWORD: ${EVENT_DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      ALLOWED_HOSTS: "*"
    depends_on:
      - postgres
    networks:
      - eventhub-net

  user-service:
    build:
      context: ./services/user-service
    environment:
      SECRET_KEY: user-service-secret
      DEBUG: "0"
      DB_NAME: ${USER_DB_NAME}
      DB_USER: ${USER_DB_USER}
      DB_PASSWORD: ${USER_DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      ALLOWED_HOSTS: "*"
    depends_on:
      - postgres
    networks:
      - eventhub-net

  frontend-service:
    build:
      context: ./services/frontend-service
    depends_on:
      - event-service
      - user-service
    networks:
      - eventhub-net

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - frontend-service
      - event-service
      - user-service
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - eventhub-net

volumes:
  postgres_data:

networks:
  eventhub-net:
    driver: bridge
