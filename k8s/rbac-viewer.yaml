apiVersion: v1
kind: ServiceAccount
metadata:
  name: eventhub-viewer
  namespace: eventhub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eventhub-read-role
  namespace: eventhub
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eventhub-read-binding
  namespace: eventhub
subjects:
  - kind: ServiceAccount
    name: eventhub-viewer
    namespace: eventhub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eventhub-read-role
